name: ledgera-app-${LEDGERA_APP_MODE:-devnet}

x-app-environment: &app-environment
  DATABASE_URL: ${LEDGERA_DATABASE_URL:?Run make app-up}
  DEPLOYMENTS_FILE: /deployments/${LEDGERA_APP_MODE:-devnet}.json

x-app-healthcheck: &app-healthcheck
  interval: 3s
  timeout: 2s
  retries: 15

x-vasp: &vasp
  restart: on-failure
  build:
    context: .
    dockerfile: services/Dockerfile
    args:
      SERVICE: vasp
  user: ${LEDGERA_UID:-1000}:${LEDGERA_GID:-1000}
  volumes:
    - ./deployments:/deployments:ro
  networks: [app]
  depends_on:
    gateway:
      condition: service_healthy
  healthcheck:
    <<: *app-healthcheck
    test:
      - CMD
      - node
      - -e
      - >-
        fetch("http://127.0.0.1:" + process.env.PORT + "/healthz").then(r => {
          if (!r.ok) process.exitCode = 1
        })

services:
  postgres:
    image: postgres:17@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf
    environment:
      POSTGRES_USER: ledgera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ledgera
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, pg_isready, -U, ledgera, -d, ledgera]

  gateway:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: gateway
    user: ${LEDGERA_UID:-1000}:${LEDGERA_GID:-1000}
    environment:
      <<: *app-environment
      SEQUENCER_RPC_URLS: ${SEQUENCER_RPC_URLS:?Run make app-up}
      GATEWAY_PRIVATE_KEY: ${GATEWAY_PRIVATE_KEY:?Run make keys}
      RELAYER_KEYS: '{"1":"${RELAYER_A_PRIVATE_KEY:?Run make keys}","2":"${RELAYER_B_PRIVATE_KEY:?Run make keys}"}'
      VASP_API_KEYS: '{"1":"${VASP_A_GATEWAY_API_KEY:?Run make keys}","2":"${VASP_B_GATEWAY_API_KEY:?Run make keys}"}'
      COMMIT_INTERVAL_SEC: ${COMMIT_INTERVAL_SEC:-30}
      DEMO_MODE: ${DEMO_MODE:-false}
      ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?Run make keys}
    volumes:
      - ./deployments:/deployments:ro
    ports:
      - 127.0.0.1:8600:8600
    networks: [app, chain]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8600/healthz').then(r => { if (!r.ok) process.exitCode = 1 })",
        ]

  auditor:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: auditor
    user: ${LEDGERA_UID:-1000}:${LEDGERA_GID:-1000}
    environment:
      <<: *app-environment
      AUDIT_RPC_URL: ${AUDIT_RPC_URL:-http://rpc-proxy:8545}
      GATEWAY_URL: http://gateway:8600
      INCLUSION_DEADLINE_SEC: ${INCLUSION_DEADLINE_SEC:-120}
      TIME_TOLERANCE_SEC: ${TIME_TOLERANCE_SEC:-5}
      AUDIT_INTERVAL_SEC: ${AUDIT_INTERVAL_SEC:-10}
    volumes:
      - ./deployments:/deployments:ro
    ports:
      - 127.0.0.1:8650:8650
    networks: [app]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8650/healthz').then(r => { if (!r.ok) process.exitCode = 1 })",
        ]

  vasp-a:
    <<: *vasp
    environment:
      <<: *app-environment
      PORT: 8621
      VASP_ID: 1
      VASP_NAME: VASP A
      CUSTOMER_ID_PREFIX: A
      L2_RPC_URL: http://rpc-proxy:8545
      GATEWAY_URL: http://gateway:8600
      CONSORTIUM_URL: http://consortium:8630
      AML_THRESHOLD_TUSD: ${AML_THRESHOLD_TUSD:-5000}
      AML_THRESHOLD_TJPY: ${AML_THRESHOLD_TJPY:-500000}
      AML_WATCHLIST: ${AML_WATCHLIST:-}
      GATEWAY_API_KEY: ${VASP_A_GATEWAY_API_KEY:?Run make keys}
      VASP_ADMIN_PRIVATE_KEY: ${VASP_A_ADMIN_PRIVATE_KEY:?Run make keys}
      VASP_SIGNER_PRIVATE_KEY: ${VASP_A_SIGNER_PRIVATE_KEY:?Run make keys}
      VASP_KEY_ENCRYPTION_KEY: ${VASP_A_KEY_ENCRYPTION_KEY:?Run make keys}
      ADMIN_TOKEN: ${VASP_A_ADMIN_TOKEN:?Run make keys}
      AUDITOR_API_KEY: ${VASP_A_AUDITOR_KEY:?Run make keys}
      KYC_VALIDITY_DAYS: ${KYC_VALIDITY_DAYS:-365}
      TRAVEL_RULE_AUTO_APPROVE: ${TRAVEL_RULE_AUTO_APPROVE:-false}
      TRAVEL_RULE_TTL_SEC: ${TRAVEL_RULE_TTL_SEC:-600}
      MARKET_MAKER_VASP_ID: ${MARKET_MAKER_VASP_ID:-2}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - 127.0.0.1:8621:8621

  vasp-b:
    <<: *vasp
    environment:
      <<: *app-environment
      PORT: 8622
      VASP_ID: 2
      VASP_NAME: VASP B
      CUSTOMER_ID_PREFIX: B
      L2_RPC_URL: http://rpc-proxy:8545
      GATEWAY_URL: http://gateway:8600
      CONSORTIUM_URL: http://consortium:8630
      AML_THRESHOLD_TUSD: ${AML_THRESHOLD_TUSD:-5000}
      AML_THRESHOLD_TJPY: ${AML_THRESHOLD_TJPY:-500000}
      AML_WATCHLIST: ${AML_WATCHLIST:-}
      GATEWAY_API_KEY: ${VASP_B_GATEWAY_API_KEY:?Run make keys}
      VASP_ADMIN_PRIVATE_KEY: ${VASP_B_ADMIN_PRIVATE_KEY:?Run make keys}
      VASP_SIGNER_PRIVATE_KEY: ${VASP_B_SIGNER_PRIVATE_KEY:?Run make keys}
      VASP_KEY_ENCRYPTION_KEY: ${VASP_B_KEY_ENCRYPTION_KEY:?Run make keys}
      ADMIN_TOKEN: ${VASP_B_ADMIN_TOKEN:?Run make keys}
      AUDITOR_API_KEY: ${VASP_B_AUDITOR_KEY:?Run make keys}
      KYC_VALIDITY_DAYS: ${KYC_VALIDITY_DAYS:-365}
      TRAVEL_RULE_AUTO_APPROVE: ${TRAVEL_RULE_AUTO_APPROVE:-false}
      TRAVEL_RULE_TTL_SEC: ${TRAVEL_RULE_TTL_SEC:-600}
      MARKET_MAKER_VASP_ID: ${MARKET_MAKER_VASP_ID:-2}
      MARKET_MAKER_ENABLED: ${MARKET_MAKER_ENABLED:-true}
      TREASURY_PRIVATE_KEY: ${VASP_B_TREASURY_PRIVATE_KEY:?Run make keys}
      RFQ_RATE_JPY_PER_USD: ${RFQ_RATE_JPY_PER_USD:-155.20}
      RFQ_TTL_SEC: ${RFQ_TTL_SEC:-30}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - 127.0.0.1:8622:8622

  consortium:
    restart: on-failure
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: consortium
    user: ${LEDGERA_UID:-1000}:${LEDGERA_GID:-1000}
    environment:
      <<: *app-environment
      PORT: 8630
      L2_RPC_URL: http://rpc-proxy:8545
      GATEWAY_URL: http://gateway:8600
      CONSORTIUM_MEMBER_KEYS: '["${CONSORTIUM_1_PRIVATE_KEY:?Run make keys}","${CONSORTIUM_2_PRIVATE_KEY:?Run make keys}","${CONSORTIUM_3_PRIVATE_KEY:?Run make keys}"]'
      ADMIN_TOKEN: ${CONSORTIUM_ADMIN_TOKEN:?Run make keys}
    volumes:
      - ./deployments:/deployments:ro
    ports:
      - 127.0.0.1:8630:8630
    networks: [app]
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:8630/healthz").then(response => {
            if (!response.ok) process.exitCode = 1
          })

  indexer:
    restart: on-failure
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: indexer
    user: ${LEDGERA_UID:-1000}:${LEDGERA_GID:-1000}
    environment:
      <<: *app-environment
      PORT: 8640
      L2_RPC_URL: http://rpc-proxy:8545
      ROLLUP_RPC_URL: ${LEDGERA_ROLLUP_RPC_URL:-}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-1000}
    volumes:
      - ./deployments:/deployments:ro
    ports:
      - 127.0.0.1:8640:8640
    networks: [app]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *app-healthcheck
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:8640/healthz").then(response => {
            if (!response.ok) process.exitCode = 1
          })

networks:
  app:
    name: ledgera
    external: true
  chain:
    name: ledgera-chain
    external: true

volumes:
  postgres-data:
