x-reth: &reth
  restart: unless-stopped
  command:
    - node
    - --chain=/workspace/genesis.json
    - --datadir=/data
    - --http
    - --http.addr=0.0.0.0
    - --http.port=8545
    - --http.api=eth,net,web3
    - --authrpc.addr=0.0.0.0
    - --authrpc.port=8551
    - --authrpc.jwtsecret=/workspace/jwt.txt
    - --rollup.disable-tx-pool-gossip
    - --disable-discovery
  networks: [engine]

x-node: &node
  restart: unless-stopped
  image: ${OP_NODE_IMAGE}
  environment: &l1
    OP_NODE_L1_ETH_RPC: ${L1_RPC_URL:?Set L1_RPC_URL in .env}
    OP_NODE_L1_BEACON: ${L1_BEACON_URL:?Set L1_BEACON_URL in .env}
    OP_NODE_L1_TRUST_RPC: ${L1_TRUST_RPC:-false}
  volumes:
    - ../runtime/rollup.json:/workspace/rollup.json:ro
    - ../runtime/jwt.txt:/workspace/jwt.txt:ro
  networks: [app, engine]

x-node-args: &node-args
  - op-node
  - --l2.jwt-secret=/workspace/jwt.txt
  - --l2.enginekind=reth
  - --rollup.config=/workspace/rollup.json
  - --sequencer.enabled=false
  - --verifier.l1-confs=4
  - --p2p.disable
  - --rpc.addr=0.0.0.0
  - --rpc.port=8547

services:
  op-reth-replica:
    <<: *reth
    image: ${OP_RETH_IMAGE}
    pull_policy: never
    volumes:
      - ../runtime/genesis.json:/workspace/genesis.json:ro
      - ../runtime/jwt.txt:/workspace/jwt.txt:ro
      - op-reth-replica-data:/data

  op-node-replica:
    <<: *node
    environment:
      <<: *l1
      OP_NODE_L2_ENGINE_RPC: http://op-reth-replica:8551
    command: *node-args
    depends_on: [op-reth-replica]

  op-reth-control:
    <<: *reth
    profiles: [control]
    image: ${OP_RETH_STOCK_IMAGE}
    volumes:
      - ../runtime/genesis.json:/workspace/genesis.json:ro
      - ../runtime/jwt.txt:/workspace/jwt.txt:ro
      - op-reth-control-data:/data

  op-node-control:
    <<: *node
    profiles: [control]
    environment:
      <<: *l1
      OP_NODE_L2_ENGINE_RPC: http://op-reth-control:8551
    command: *node-args
    depends_on: [op-reth-control]

networks:
  engine:
    internal: true
  app:
    external: true
    name: ledgera

volumes:
  op-reth-replica-data:
  op-reth-control-data:
